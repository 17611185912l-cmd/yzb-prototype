<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>小U - 教师入驻引导</title>
  <style>
    :root { --ink:#172337; --muted:#65758b; --line:#dbe3ed; --paper:#fff; --page:#eef3f8; --soft:#f5f8fb; --accent:#146c94; --accent-soft:#e7f5f8; --warn:#a76212; }
    * { box-sizing:border-box; }
    body { margin:0; background:#dfe7ef; color:var(--ink); font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,textarea { font:inherit; } button { cursor:pointer; }
    .phone { width:min(100%,430px); min-height:100vh; margin:0 auto; background:var(--page); position:relative; overflow:hidden; }
    .topbar { height:56px; padding:0 16px; background:var(--paper); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
    .brand { display:flex; gap:9px; align-items:center; font-weight:700; }.brand small { display:block; color:var(--muted); font-size:11px; font-weight:400; }
    .u-avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:white; font-weight:800; box-shadow:0 3px 8px #146c9430; }
    .summary-trigger { border:0; background:none; color:var(--accent); font-size:13px; padding:8px 0; }
    .status { padding:8px 16px; background:#f9fcfd; color:var(--muted); border-bottom:1px solid var(--line); font-size:12px; }.status b { color:var(--accent); }
    .chat { padding:18px 16px 116px; min-height:calc(100vh - 92px); }
    .message { display:flex; gap:9px; margin:0 0 16px; align-items:flex-start; }.message.user { justify-content:flex-end; }.message.user .u-avatar { display:none; }
    .bubble { max-width:calc(100% - 46px); padding:11px 13px; background:var(--paper); border:1px solid var(--line); border-radius:4px 14px 14px 14px; box-shadow:0 1px 2px #17233708; }.user .bubble { background:var(--accent); border-color:var(--accent); color:#fff; border-radius:14px 4px 14px 14px; }
    .bubble p { margin:0 0 7px; }.bubble p:last-child { margin-bottom:0; }.hint { font-size:12px; color:var(--muted); }
    .assistant-name { font-size:11px; color:var(--muted); margin:0 0 3px 1px; }.message.user .assistant-name { display:none; }
    .choices { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 17px 42px; }.choice { min-height:36px; border:1px solid #9ec9d7; background:#fff; color:#175976; padding:7px 11px; border-radius:4px; text-align:left; }.choice.selected { background:var(--accent); border-color:var(--accent); color:#fff; }.choice.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .upload-card { margin:0 0 17px 42px; padding:12px; background:#fff; border:1px dashed #8cabb9; border-radius:4px; }.upload-card input { display:none; }.upload-label { display:flex; align-items:center; justify-content:space-between; color:#175976; font-weight:600; }.upload-label span:last-child { font-size:12px; font-weight:400; color:var(--muted); }.file-note { margin-top:7px; color:var(--muted); font-size:12px; }
    .inline-upload { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; padding:8px 9px; border:1px dashed #8cabb9; border-radius:3px; color:#175976; font-weight:600; font-size:13px; }.inline-upload input { display:none; }.inline-upload i { font-style:normal; color:var(--muted); font-size:12px; font-weight:400; }
    .quick-form { margin:0 0 17px 42px; padding:12px; background:white; border:1px solid var(--line); border-radius:4px; }.quick-form label { display:block; font-size:12px; font-weight:600; margin:0 0 6px; }.quick-form input,.quick-form textarea,.quick-form select { width:100%; padding:10px; border:1px solid #b9c7d4; border-radius:3px; outline:none; background:#fff; }.quick-form select { margin-bottom:10px; color:var(--ink); }.quick-form textarea { min-height:78px; resize:vertical; }.quick-form input:focus,.quick-form textarea:focus,.quick-form select:focus { border-color:var(--accent); }.quick-form .form-action { margin-top:8px; border:0; border-radius:3px; background:var(--accent); color:#fff; padding:8px 14px; }
    .classroom-card { margin:0 0 17px 42px; padding:12px; background:#fff; border:1px solid var(--line); border-radius:4px; }.classroom-card h3 { margin:0 0 10px; font-size:13px; }.classroom-card h3:not(:first-child) { margin-top:14px; }.classroom-card .choices { margin:0; }.classroom-card .choice { font-size:12px; min-height:32px; }.classroom-card .confirm { margin-top:14px; width:100%; min-height:38px; border:0; border-radius:3px; background:var(--accent); color:#fff; font-weight:600; }.classroom-card .confirm:disabled { background:#aab8c3; cursor:not-allowed; }
    .option-grid { margin:0 0 17px 42px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }.option-grid .choice { width:100%; }.option-grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .doc-tags { margin:0 0 17px 42px; display:flex; gap:7px; flex-wrap:wrap; }.doc-tag { padding:5px 8px; border:1px solid #9ec9d7; background:#fff; color:#175976; border-radius:3px; font-size:12px; }
    .typing { display:none; margin:0 0 15px 42px; color:var(--muted); font-size:12px; }.typing.show { display:block; }
    .composer { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,430px); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); display:flex; gap:8px; z-index:6; }.composer input { flex:1; min-width:0; border:1px solid #b9c7d4; border-radius:3px; padding:10px; outline:none; }.composer input:disabled { background:#f5f8fb; color:#8a9aac; }.composer button { flex:0 0 44px; border:0; border-radius:3px; background:var(--accent); color:#fff; font-weight:700; }.composer.hidden { display:none; }.attach { flex:0 0 40px; height:40px; border:1px solid #b9c7d4; border-radius:3px; display:grid; place-items:center; color:#52677b; font-size:24px; line-height:1; cursor:pointer; }.attach input { display:none; }
    .summary { position:fixed; z-index:10; inset:0; display:none; background:#17233755; }.summary.show { display:block; }.sheet { position:absolute; bottom:0; left:50%; width:min(100%,430px); max-height:88vh; overflow:auto; transform:translateX(-50%); background:#fff; border-radius:12px 12px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }.sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }.sheet-head h2 { font-size:17px; margin:0; }.sheet-note { margin:0 0 16px; color:var(--muted); font-size:12px; }.close { border:0; background:none; color:var(--muted); font-size:22px; }.review-form { display:grid; gap:13px; }.review-group { padding-top:13px; border-top:1px solid var(--line); }.review-group:first-child { padding-top:0; border-top:0; }.review-group h3 { margin:0 0 10px; font-size:14px; }.review-grid { display:grid; grid-template-columns:1fr; gap:10px; }.review-field { min-width:0; }.review-field.full { grid-column:auto; }.review-field label { display:block; margin:0 0 5px; color:var(--muted); font-size:12px; }.review-field input,.review-field select,.review-field textarea { width:100%; border:1px solid #b9c7d4; border-radius:3px; padding:10px; color:var(--ink); background:#fff; outline:none; }.review-field textarea { min-height:88px; resize:vertical; }.review-field input:focus,.review-field select:focus,.review-field textarea:focus { border-color:var(--accent); }.template-list { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 8px; }.template-chip { min-height:31px; padding:5px 9px; border:1px solid #9ec9d7; border-radius:3px; background:#fff; color:#175976; font-size:12px; }.template-chip.selected { border-color:var(--accent); background:var(--accent); color:#fff; }.review-actions { position:sticky; bottom:0; display:flex; gap:9px; margin:0 -16px -18px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); }.review-actions button { min-height:42px; border-radius:3px; padding:0 14px; font-weight:600; }.review-save { flex:1; border:1px solid #9ec9d7; background:#fff; color:#175976; }.review-submit { flex:1.4; border:0; background:var(--accent); color:#fff; }.submission-note { margin:13px 0 0; padding:10px; border:1px solid #9ec9d7; border-radius:3px; background:var(--accent-soft); color:#175976; font-size:13px; }.personal-center { position:absolute; z-index:20; inset:0; display:none; background:var(--page); }.personal-center.show { display:block; }.center-top { height:56px; padding:0 16px; display:flex; align-items:center; background:#fff; border-bottom:1px solid var(--line); font-weight:700; font-size:17px; }.center-body { padding:18px 16px; }.center-profile { display:flex; align-items:center; gap:12px; padding:15px; background:#fff; border:1px solid var(--line); border-radius:5px; }.center-avatar { width:46px; height:46px; display:grid; place-items:center; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:18px; font-weight:700; }.center-profile b { display:block; }.center-profile span { display:block; margin-top:2px; color:var(--muted); font-size:12px; }.application-status { margin-top:14px; padding:15px; background:#fff; border:1px solid var(--line); border-radius:5px; }.application-status strong { display:block; margin-bottom:4px; }.application-status p { margin:0; color:var(--muted); font-size:13px; }.status-chip { display:inline-block; margin-bottom:8px; padding:3px 7px; background:var(--accent-soft); color:#175976; border-radius:3px; font-size:12px; }.return-note { margin:22px 0 0; text-align:center; color:var(--muted); font-size:12px; }
    .done { margin:24px 0 0; padding:18px; background:#fff; border:1px solid #9ec9d7; border-radius:5px; }.done h2 { margin:0 0 7px; font-size:18px; }.done p { margin:0; color:var(--muted); }.done button { margin-top:12px; border:0; background:var(--accent); color:white; border-radius:3px; padding:9px 12px; }
    @media (min-width:431px) { .phone { min-height:calc(100vh - 32px); margin:16px auto; box-shadow:0 0 0 1px #c8d4df,0 10px 28px #17233718; }.composer { bottom:16px; } }
  </style>
</head>
<body>
  <main class="phone">
    <header class="topbar"><div class="brand"><span class="u-avatar">U</span><div>小U 入驻助手<small>陪你完成教师入驻</small></div></div><button class="summary-trigger" id="openSummary">资料清单</button></header>
    <div class="status"><b id="progress">0%</b> 已整理，随时可以提交基础资料</div>
    <section class="chat" id="chat"></section>
    <form class="composer" id="composer"><label class="attach" title="上传毕业证或学位证"><input type="file" id="docs" multiple accept="image/*,.pdf,application/pdf"><span>＋</span></label><input id="reply" autocomplete="off" placeholder="先选择“我想先聊聊”或上传材料" disabled><button aria-label="发送" type="submit">发送</button></form>
    <section class="personal-center" id="personalCenter"><header class="center-top">个人中心</header><div class="center-body"><div class="center-profile"><div class="center-avatar" id="centerInitial">王</div><div><b id="centerName">王晓老师</b><span>优坐标教师入驻</span></div></div><div class="application-status"><span class="status-chip">审核中</span><strong>教师入驻申请</strong><p>小U 已收到你的资料，审核结果将通过已授权手机号通知。</p></div><p class="return-note">已退出小U入驻对话</p></div></section>
  </main>
  <section class="summary" id="summary"><div class="sheet"><div class="sheet-head"><h2>查看资料并提交</h2><button class="close" id="closeSummary" aria-label="关闭">×</button></div><p class="sheet-note">可核对、修改或补充资料，确认无误后直接提交。</p><div id="summaryList"></div></div></section>
  <script>
    const state={name:'',phone:'',gender:'',age:'',teachingExp:'',teacherType:'',school:'',education:'',grades:[],subjects:[],methods:[],idCard:'',portrait:'',idFront:'',idBack:'',credentials:[],intro:'',focus:[],result:'',docs:[]};
    const chat=document.querySelector('#chat'), composer=document.querySelector('#composer'), reply=document.querySelector('#reply'); let currentValidator=null, conversationStarted=false;
    const avatar='<span class="u-avatar">U</span>', subjectAll=['语文','数学','英语','物理','化学','生物','历史','地理','政治','编程','美术','音乐','奥数','英语单词'];
    const questionMap={
      name:{label:'姓名',ask:'先让我认识一下你吧，学生们会怎么称呼你？',placeholder:'例如：王老师'},
      phone:{label:'手机号',ask:'方便留下一个手机号吗？审核进度和课堂提醒都从这里送达。',placeholder:'请输入 11 位手机号'},
      profile:{label:'个人情况',ask:'现在的你，更接近哪一种状态？我会据此调整后面的问题。'},
      school:{label:'院校',ask:'这段求学经历很重要。请输入学校关键词，小U 会帮你记录。',placeholder:'例如：北京师范大学'},
      teaching:{label:'教学方向',ask:'想象一下你最享受的课堂：你愿意陪伴哪个阶段的孩子？可多选。'},
      subjects:{label:'擅长科目',ask:'那么，你最想帮孩子在哪些领域找到突破口？可多选。'},
      methods:{label:'授课方式',ask:'理想的相遇方式是什么？可以多选。'},
      intro:{label:'个人简介',ask:'最后，帮学生和家长认识一个真实的你。你可以选一种表达方式，再微调成自己的语气。'}
    };
    function addAssistant(text){chat.insertAdjacentHTML('beforeend',`<div class="message"><div>${avatar}</div><div><div class="assistant-name">小U</div><div class="bubble">${text}</div></div></div>`);scrollBottom();}
    function addUser(text){chat.insertAdjacentHTML('beforeend',`<div class="message user"><div class="bubble">${text}</div></div>`);scrollBottom();}
    function addChoices(items,{multi=false,onDone}={}){const wrap=document.createElement('div');wrap.className=items.length>5?'option-grid three':'choices';const selected=[];items.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=item; b.onclick=()=>{if(multi){b.classList.toggle('selected');const i=selected.indexOf(item);i<0?selected.push(item):selected.splice(i,1);done.hidden=!selected.length;}else{wrap.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');setTimeout(()=>{wrap.remove();onDone(item)},180);}};wrap.appendChild(b);});let done;if(multi){done=document.createElement('button');done.type='button';done.className='choice primary';done.textContent='就这些';done.hidden=true;done.onclick=()=>{wrap.remove();onDone(selected)};wrap.appendChild(done);}chat.appendChild(wrap);scrollBottom();}
    function askText(key,validate){addAssistant(`<p>${questionMap[key].ask}</p>`);composer.classList.remove('hidden');reply.placeholder=questionMap[key].placeholder;reply.dataset.key=key;currentValidator=validate||null;reply.focus();}
    function startChat(){if(conversationStarted)return;conversationStarted=true;state.phone='13800138000';reply.disabled=false;startConversation(state.teacherType?'classroom':state.name?'profile':'name');}
    function receiveCredentials(names){state.docs=[...state.docs,...names];state.credentials=[...state.credentials,...names];const hasDiploma=names.some(x=>x.includes('毕业证')),hasDegree=names.some(x=>x.includes('学位证'));addUser(`已发送 ${names.length} 份学历材料`);if(hasDiploma&&hasDegree){state.name='王晓';state.teacherType='毕业生';state.school='北京师范大学';state.education='硕士研究生';addAssistant(conversationStarted?'<p>王晓老师，资料已更新。</p>':'<p>王晓老师，认识你很高兴。</p><p>接下来，我们一起确认你的课堂名片吧。</p>');}else addAssistant('<p>收到这份材料了。我们再聊几句，补全你的教师资料吧。</p>');if(!conversationStarted)startChat();}
    function setupAttachment(){document.querySelector('#docs').onchange=e=>{const names=[...e.target.files].map(x=>x.name);if(!names.length)return;receiveCredentials(names);e.target.value='';};}
    function startConversation(next){if(next==='name')askText('name',v=>v.trim().length>0);if(next==='phoneAuth')askPhoneAuth();if(next==='profile')askProfile();if(next==='classroom')askClassroom();if(next==='intro')askIntro();}
    function askProfile(){addAssistant('<p>现在的你，更接近哪一种状态？也顺便告诉我你的学校和学历，我会据此调整后面的课堂问题。</p>');addChoices(['在校生','毕业生'],{onDone:v=>{state.teacherType=v;addUser(v);if(v==='在校生')state.subjects=['英语单词'];const schoolForm=document.createElement('div');schoolForm.className='quick-form';schoolForm.innerHTML=`<label>${v==='在校生'?'就读院校':'毕业院校'}</label><input placeholder="例如：北京师范大学"><label>学历</label><select><option value="">请选择学历</option><option>大专</option><option>本科</option><option>硕士研究生</option><option>博士研究生</option><option>其他</option></select><button type="button" class="form-action">确认学校和学历</button>`;const input=schoolForm.querySelector('input'),education=schoolForm.querySelector('select');schoolForm.querySelector('button').onclick=()=>{const school=input.value.trim(),degree=education.value;if(school.length<2){input.focus();return;}if(!degree){education.focus();return;}state.school=school;state.education=degree;addUser(`${school} · ${degree}`);schoolForm.remove();startConversation('classroom');};chat.appendChild(schoolForm);input.focus();scrollBottom();}});}
    function askClassroom(){addAssistant('<p>我们用一张课堂名片，把学段、科目和授课方式一次选好。之后小U 就能更准确地为你整理入驻资料。</p>');const card=document.createElement('div');card.className='classroom-card';const gradeTitle=state.teacherType==='在校生'?'当前在校老师的首个教学方向':'擅长年级';card.innerHTML=`<h3>${gradeTitle}</h3><div class="choices" data-part="grades"></div><h3>擅长科目</h3><div class="choices" data-part="subjects"></div><h3>授课方式</h3><div class="choices" data-part="methods"></div><button type="button" class="confirm" disabled>确认课堂名片</button>`;chat.appendChild(card);const grades=['小学','初一初二','初三','高一高二','高三'], methods=['线上','线下','上门'];const addOption=(box,label,selected,disabled,onToggle)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(selected?' selected':'')+(disabled?' disabled':'');b.textContent=label;b.disabled=disabled;b.onclick=()=>{onToggle(label,b);refreshConfirm();};box.appendChild(b);};const gradeBox=card.querySelector('[data-part=grades]'),subjectBox=card.querySelector('[data-part=subjects]'),methodBox=card.querySelector('[data-part=methods]'),confirm=card.querySelector('.confirm');function renderSubjects(){subjectBox.innerHTML='';if(state.teacherType==='在校生'){state.subjects=['英语单词'];addOption(subjectBox,'英语单词',true,true,()=>{});return;}const primaryOnly=state.grades.length===1&&state.grades[0]==='小学';const options=primaryOnly?['语文','数学','英语']:subjectAll;state.subjects=state.subjects.filter(x=>options.includes(x));options.forEach(x=>addOption(subjectBox,x,state.subjects.includes(x),false,(val,button)=>{button.classList.toggle('selected');state.subjects=button.classList.contains('selected')?[...state.subjects,val]:state.subjects.filter(x=>x!==val);}));}if(state.teacherType==='在校生'){gradeBox.innerHTML='<span class="hint">在校老师将默认从英语单词开始建立第一份教学档案。</span>';}else grades.forEach(x=>addOption(gradeBox,x,false,false,(val,button)=>{button.classList.toggle('selected');state.grades=button.classList.contains('selected')?[...state.grades,val]:state.grades.filter(x=>x!==val);renderSubjects();}));methods.forEach(x=>addOption(methodBox,x,false,false,(val,button)=>{button.classList.toggle('selected');state.methods=button.classList.contains('selected')?[...state.methods,val]:state.methods.filter(x=>x!==val);}));function refreshConfirm(){const ready=(state.teacherType==='在校生'||state.grades.length)&&state.subjects.length&&state.methods.length;confirm.disabled=!ready;}renderSubjects();refreshConfirm();confirm.onclick=()=>{addUser(`课堂名片：${state.grades.join('、')||'英语单词'} / ${state.subjects.join('、')} / ${state.methods.join('、')}`);card.remove();offerSubmit();};scrollBottom();}
    function askTeaching(){addAssistant(`<p>${questionMap.teaching.ask}</p>`);const grades=state.teacherType==='在校生'?['小学','初一初二','初三','高一高二','高三']:['小学','初一初二','初三','高一高二','高三'];addChoices(grades,{multi:true,onDone:v=>{state.grades=v;addUser(v.join('、'));startConversation('subjects')}});}
    function askSubjects(){let list=subjectAll,tip='';if(state.teacherType==='在校生'){list=['英语单词'];tip='在校老师的首个服务方向是英语单词，我已先为你选好。';}else if(state.grades.length===1&&state.grades[0]==='小学'){list=['语文','数学','英语'];tip='小学阶段先聚焦语文、数学、英语，让选择更贴近学生需要。';}addAssistant(`<p>${questionMap.subjects.ask}</p>${tip?`<p class="hint">${tip}</p>`:''}`);if(state.teacherType==='在校生'){state.subjects=['英语单词'];addUser('英语单词');startConversation('methods');}else addChoices(list,{multi:true,onDone:v=>{state.subjects=v;addUser(v.join('、'));startConversation('methods')}});}
    function askMethods(){addAssistant(`<p>${questionMap.methods.ask}</p>`);addChoices(['线上','线下','上门'],{multi:true,onDone:v=>{state.methods=v;addUser(v.join('、'));startConversation('intro')}});}
    function askIntro(){addAssistant(`<p>${questionMap.intro.ask}</p>`);addChoices(['认真负责型','方法引导型','陪伴鼓励型','目标规划型'],{onDone:v=>{state.intro={ '认真负责型':'我是一名认真负责、耐心细致的老师，重视与学生及家长保持充分沟通，会先了解孩子的学习基础和习惯，再制定阶段性目标。','方法引导型':'我擅长梳理知识结构和学习方法，将抽象知识拆解为易理解、可练习的步骤，帮助学生形成自主复盘能力。','陪伴鼓励型':'我愿意倾听学生的困惑，用稳定的课堂节奏、清晰的反馈和持续陪练，陪伴孩子从愿意尝试开始建立信心。','目标规划型':'我会根据学生的学习目标制定个性化计划，在不同阶段侧重基础、方法、真题与时间管理。'}[v];addUser(v);askResultOptional();}});}
    function offerSubmit(){updateProgress();addAssistant('<p>基础必填资料已经整理好了。你可以先提交，也可以继续补充证件、教学成果和更多信息。</p>');addChoices(['查看资料并提交','继续填写'],{onDone:v=>{addUser(v);if(v==='继续填写')askIntro();else openSummary();}});}
    function askResultOptional(){addAssistant('<p>个人简介已经收好。还想补充一段教学成果吗？</p>');addChoices(['填写教学成果','先不填了'],{onDone:v=>{addUser(v);if(v==='填写教学成果')askResult();else finish();}});}
    function askResult(){addAssistant('<p>太好了。用一句你最骄傲的改变，讲讲一位学生的进步吧。</p>');composer.classList.remove('hidden');reply.placeholder='例如：帮助基础薄弱的学生从 60 分提升至 85 分';reply.dataset.key='result';currentValidator=null;reply.focus();}
    function finish(){composer.classList.add('hidden');addAssistant(`<p>很好，${state.name||'老师'}。我已经把你的入驻基础资料整理好了。</p><p class="hint">证件、教学成果和更多资料可在提交后随时回来补充。</p>`);const done=document.createElement('div');done.className='done';done.innerHTML='<h2>资料待提交</h2><p>点击查看资料并提交，可核对或补充所有信息。</p><button type="button" id="finishSummary">查看资料并提交</button>';chat.appendChild(done);document.querySelector('#finishSummary').onclick=openSummary;updateProgress();scrollBottom();}
    document.querySelector('#composer').onsubmit=e=>{e.preventDefault();const value=reply.value.trim(),key=reply.dataset.key;if(!value)return;if(!currentValidator||currentValidator(value)){if(key==='name'||key==='phone'||key==='school'||key==='result')state[key]=value;addUser(value);reply.value='';composer.classList.add('hidden');currentValidator=null;if(key==='name')startConversation('profile');else if(key==='result')finish();}else addAssistant('我想再确认一下这条信息。');};
    function updateProgress(){const required=['name','phone','teacherType','school','education','grades','subjects','methods','intro'];const done=required.filter(k=>Array.isArray(state[k])?state[k].length:state[k]).length;document.querySelector('#progress').textContent=Math.round(done/required.length*100)+'%';}
    function escapeHtml(value){return String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
    const introTemplates=[['认真负责型','我是一名认真负责、耐心细致的老师，重视与学生及家长保持充分沟通。我会先了解孩子的学习基础和习惯，再制定阶段性学习目标，通过针对性练习帮助学生建立信心、稳步提升。'],['方法引导型','我擅长梳理知识结构和学习方法，善于将抽象知识拆解为易理解、可练习的步骤。课堂中会结合例题、错题和即时反馈，帮助学生找到薄弱环节，形成自主复盘与迁移应用的能力。'],['陪伴鼓励型','我注重营造轻松、专注的学习氛围，愿意倾听学生的困惑，并用鼓励和清晰的反馈陪伴成长。希望通过稳定的课堂节奏与持续陪练，让学生逐渐从害怕学习转变为愿意主动尝试。'],['目标规划型','我会根据学生的学习目标制定个性化学习计划：基础阶段夯实知识与习惯，提升阶段强化题型与方法，冲刺阶段侧重真题、错题和时间管理。每节课后均会给出可执行的复习建议。']];
    const resultTemplates=[['基础提升 60分至85分','曾辅导一名基础较薄弱的学生，先从梳理课本概念和改正作业习惯开始，再进行专题巩固。经过一个学期的持续练习，数学成绩从 60 分提升至 85 分，学习主动性也明显增强。'],['排名提升 30名至前10名','曾帮助一名初三学生建立完整的错题复盘流程，针对薄弱题型进行分层训练，并在考前进行时间分配与答题策略训练。学生由班级第 30 名提升至前 10 名，顺利达到目标学校的录取要求。'],['英语提升 至90分以上','曾陪伴一名英语基础薄弱的学生完成词汇、语法与阅读的阶段训练。通过每日词汇打卡、精读训练和错题归类，学生在期末考试中从及格边缘提升至 90 分以上，并能独立完成中等难度阅读。'],['习惯改善 单元提升15至20分','曾为一名学习效率较低的学生制定周计划和课后复盘清单，逐步改善拖延与粗心问题。经过两个月的陪伴训练，学生能够按计划完成作业，单元测试稳定提升 15 至 20 分。']];
    const focusTemplates=['基础薄弱','中考提分','高考冲刺','数学思维提升','阅读理解提升','英语词汇积累','学习习惯养成','作业效率提升','错题整理方法','竞赛启蒙'];
    function field(name,label,value,{type='text',options=[],full=false,placeholder=''}={}){const safe=escapeHtml(value);const control=type==='textarea'?`<textarea name="${name}" placeholder="${placeholder}">${safe}</textarea>`:type==='select'?`<select name="${name}">${options.map(option=>`<option${option===value?' selected':''}>${option}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${safe}" placeholder="${placeholder}">`;return `<div class="review-field${full?' full':''}"><label>${label}</label>${control}</div>`;}
    function contentTemplates(name,templates){return `<div class="template-list">${templates.map(([label,value])=>`<button type="button" class="template-chip" data-template-for="${name}" data-template="${escapeHtml(value)}">${label}</button>`).join('')}</div>`;}
    function focusTemplateList(){return `<div class="template-list">${focusTemplates.map(value=>`<button type="button" class="template-chip${state.focus.includes(value)?' selected':''}" data-focus-value="${value}">${value}</button>`).join('')}</div>`;}
    function templatedField(name,label,value,templates,placeholder){return `<div class="review-field full"><label>${label}</label>${contentTemplates(name,templates)}<textarea name="${name}" placeholder="${placeholder}">${escapeHtml(value)}</textarea></div>`;}
    function focusField(){return `<div class="review-field full"><label>教学侧重</label>${focusTemplateList()}<textarea name="focus" placeholder="可多选模板后微调">${escapeHtml(state.focus.join('、'))}</textarea></div>`;}
    function saveSummary(){const form=document.querySelector('#reviewForm'),data=new FormData(form);state.name=data.get('name').trim();state.phone=data.get('phone').trim();state.teacherType=data.get('teacherType');state.gender=data.get('gender');state.age=data.get('age').trim();state.teachingExp=data.get('teachingExp').trim();state.school=data.get('school').trim();state.education=data.get('education');state.grades=data.get('grades').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);state.subjects=data.get('subjects').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);state.methods=data.get('methods').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);state.idCard=data.get('idCard').trim();state.portrait=data.get('portrait').trim();state.credentials=data.get('credentials').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);state.intro=data.get('intro').trim();state.focus=data.get('focus').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);state.result=data.get('result').trim();updateProgress();}
    function showPersonalCenter(){const displayName=`${state.name||'王晓'}老师`;document.querySelector('#centerName').textContent=displayName;document.querySelector('#centerInitial').textContent=(state.name||'王').slice(0,1);document.querySelector('#personalCenter').classList.add('show');window.location.hash='personal-center';}
    function openSummary(){const list=document.querySelector('#summaryList');list.innerHTML=`<form id="reviewForm" class="review-form"><section class="review-group"><h3>基本信息</h3><div class="review-grid">${field('name','姓名',state.name)}${field('phone','手机号',state.phone,{type:'tel'})}${field('teacherType','老师类型',state.teacherType,{type:'select',options:['在校生','毕业生']})}${field('gender','性别',state.gender,{type:'select',options:['未填写','男','女']})}${field('age','年龄',state.age,{type:'number',placeholder:'请输入年龄'})}${field('teachingExp','教龄',state.teachingExp,{type:'number',placeholder:'请输入教龄（年）'})}</div></section><section class="review-group"><h3>学历与证件</h3><div class="review-grid">${field('school','院校',state.school)}${field('education','学历',state.education,{type:'select',options:['未填写','大专','本科','硕士研究生','博士研究生','其他']})}${field('idCard','身份证号',state.idCard,{full:true,placeholder:'上传身份证后自动识别，可修改'})}${field('credentials','学历证明',state.credentials.join('、'),{full:true,placeholder:'毕业证、学位证、教师资格证等'})}${field('portrait','个人形象照',state.portrait,{full:true,placeholder:'可后续补充'})}</div></section><section class="review-group"><h3>教学信息</h3><div class="review-grid">${field('grades','擅长年级',state.grades.join('、'),{full:true,placeholder:'例如：初一初二、高一高二'})}${field('subjects','擅长科目',state.subjects.join('、'),{full:true,placeholder:'例如：数学、物理'})}${field('methods','授课方式',state.methods.join('、'),{full:true,placeholder:'例如：线上、线下'})}${templatedField('intro','个人简介',state.intro,introTemplates,'选择模板后可继续修改')}${focusField()}${templatedField('result','教学成果',state.result,resultTemplates,'选择模板后可继续修改')}</div></section><div class="review-actions"><button class="review-save" type="button" id="saveReview">保存修改</button><button class="review-submit" type="button" id="submitReview">提交入驻申请</button></div></form>`;document.querySelector('#saveReview').onclick=()=>{saveSummary();const note=document.querySelector('#reviewForm .submission-note');if(note)note.remove();document.querySelector('#reviewForm').insertAdjacentHTML('beforeend','<p class="submission-note">修改已保存，可继续核对或直接提交。</p>');};document.querySelector('#submitReview').onclick=()=>{saveSummary();document.querySelector('#summary').classList.remove('show');composer.classList.add('hidden');addAssistant(`<p>${state.name||'老师'}，入驻申请已提交。</p><p>小U 会持续跟进审核进度，我们先回个人中心等候消息吧。</p>`);const done=document.createElement('div');done.className='done';done.innerHTML='<h2>入驻申请已提交</h2><p>本次入驻对话已结束。</p><button type="button" id="returnCenter">返回个人中心</button>';chat.appendChild(done);document.querySelector('#returnCenter').onclick=showPersonalCenter;scrollBottom();};document.querySelector('#summary').classList.add('show');}
    document.querySelector('#summaryList').onclick=e=>{const button=e.target.closest('.template-chip');if(!button)return;const form=document.querySelector('#reviewForm');if(button.dataset.templateFor){form.elements[button.dataset.templateFor].value=button.dataset.template;button.closest('.template-list').querySelectorAll('.template-chip').forEach(x=>x.classList.toggle('selected',x===button));}if(button.dataset.focusValue){button.classList.toggle('selected');form.elements.focus.value=[...button.closest('.template-list').querySelectorAll('.template-chip.selected')].map(x=>x.dataset.focusValue).join('、');}};
    function scrollBottom(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}));}
    document.querySelector('#openSummary').onclick=openSummary;document.querySelector('#closeSummary').onclick=()=>document.querySelector('#summary').classList.remove('show');
    addAssistant('<p>老师您好，我是小U，让我来帮您完成入驻吧！</p><p>不用面对一长串表格，我们像聊天一样，把你的教学故事慢慢拼起来。</p>');addAssistant('<p>如果你手边有毕业证或学位证，也可以直接从输入框旁边的“＋”发给我。</p>');setupAttachment();addChoices(['我想先聊聊','模拟已上传毕业证和学位证'],{onDone:v=>{if(v==='我想先聊聊'){addUser(v);startChat();}else receiveCredentials(['毕业证.jpg','学位证.jpg']);}});
  </script>
</body>
</html>
