<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人中心 - 开通后线框原型</title>
  <style>
    :root { --ink:#202124; --mid:#697078; --line:#b8bcc1; --soft:#f1f2f3; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e6e8ea; color:var(--ink); font:14px/1.35 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
    .phone { width:min(100%,430px); min-height:100vh; margin:auto; background:#f6f7f8; padding:12px 14px 84px; }
    .status { height:30px; display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:700; }
    .signals { font-size:11px; color:var(--mid); }
    .title-row { display:flex; justify-content:space-between; align-items:center; margin:4px 4px 15px; }
    h1 { margin:0; font-size:25px; letter-spacing:1px; }
    .more { width:56px; height:30px; border:1px solid var(--line); border-radius:3px; }
    .member { background:var(--paper); border:1px solid var(--line); min-height:88px; padding:14px; display:grid; grid-template-columns:58px 1fr auto; gap:12px; align-items:center; }
    .avatar { width:56px; height:56px; border:1.5px solid var(--ink); border-radius:50%; display:grid; place-items:center; font-size:12px; color:var(--mid); }
    .name { display:flex; flex-wrap:wrap; align-items:center; gap:5px 7px; font-size:17px; font-weight:700; }
    .badge { border:1px solid var(--line); border-radius:3px; padding:1px 4px; font-size:11px; color:var(--mid); font-weight:400; }
    .sub { margin-top:6px; color:var(--mid); font-size:12px; white-space:nowrap; }
    .section { margin-top:12px; background:var(--paper); border:1px solid var(--line); padding:14px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:13px; }
    h2 { margin:0; font-size:18px; }
    .role-entries { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .role-entry { min-height:76px; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
    .role-entry .action-icon { width:34px; height:34px; margin-bottom:7px; }
    .role-overview { margin:12px 0 0; padding:13px; border:1px solid var(--line); background:var(--paper); }
    .role-overview h3 { margin:0 0 11px; font-size:15px; }
    .overview-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:7px; }
    .overview-stat { position:relative; min-width:0; padding:8px 4px; border:1px solid var(--line); text-align:center; }
    .overview-stat span { display:block; color:var(--mid); font-size:11px; white-space:nowrap; }
    .overview-stat strong { display:block; margin-top:4px; font-size:15px; }
    .stat-entry-arrow { position:absolute; top:4px; right:6px; color:var(--mid); font-size:15px; line-height:1; }
    .business-hours { margin:12px 0 0; padding:14px; border:1px solid var(--line); background:var(--paper); }
    .business-hours h3, .business-tools-panel h3 { margin:0 0 6px; font-size:16px; }
    .business-hours p { margin:0 0 12px; color:var(--mid); font-size:12px; }
    .business-hours-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
    .business-hours-stats div { padding:9px 5px; border:1px solid var(--line); text-align:center; }
    .business-hours-stats span { display:block; color:var(--mid); font-size:11px; }
    .business-hours-stats strong { display:block; margin-top:4px; font-size:16px; }
    .business-hours .primary-action { width:100%; margin:13px 0 0; }
    .detail-list.business-list { display:block; margin-top:12px; padding:0; border:0; background:transparent; }
    .business-tools-panel { padding:14px; border:1px solid var(--line); background:var(--paper); }
    .business-tools-panel > p { margin:0 0 12px; color:var(--mid); font-size:12px; }
    .business-tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .business-tool { min-height:104px; padding:12px; border:1px solid var(--line); text-align:left; }
    .business-tool strong { display:block; margin-bottom:6px; font-size:15px; }
    .business-tool span { display:block; color:var(--mid); font-size:12px; line-height:1.5; }
    .detail-list.teacher-list { display:block; margin-top:12px; padding:0; border:0; background:transparent; }
    .teacher-schedule, .teacher-tasks-panel { padding:14px; border:1px solid var(--line); background:var(--paper); }
    .teacher-schedule { margin-bottom:12px; }
    .teacher-panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .teacher-panel-head h3, .teacher-tasks-panel h3 { margin:0; font-size:16px; }
    .teacher-panel-head button { height:26px; padding:0 8px; border:1px solid var(--line); border-radius:3px; font-size:12px; }
    .teacher-schedule-row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid #e2e4e6; font-size:13px; }
    .teacher-schedule-row small { color:var(--mid); text-align:right; }
    .teacher-tasks { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .teacher-task { min-height:88px; padding:11px; border:1px solid var(--line); text-align:left; }
    .teacher-task strong { display:block; margin-bottom:6px; font-size:15px; }
    .teacher-task span { display:block; color:var(--mid); font-size:12px; line-height:1.5; }
    .teacher-quick-title { margin:12px 0 7px; font-size:14px; }
    .teacher-quick-tasks { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .teacher-quick-tasks .teacher-task { min-height:62px; padding:8px; }
    .teacher-quick-tasks .teacher-task strong { margin-bottom:3px; font-size:14px; }
    .detail-list.learning-list { display:block; margin-top:12px; padding:0; border:0; background:transparent; }
    .learning-quick-tasks { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
    .learning-quick-tasks .teacher-task { min-height:62px; padding:8px 5px; text-align:center; }
    .learning-quick-tasks .teacher-task strong { margin-bottom:3px; font-size:13px; }
    .learning-upcoming { padding:14px; border:1px solid var(--line); background:var(--paper); }
    .learning-upcoming .teacher-schedule-row { padding:10px 0; }
    .learning-main-calendar { margin-bottom:12px; padding:14px; border:1px solid var(--line); background:var(--paper); }
    .learning-main-calendar .calendar-day { min-height:48px; }
    .learning-main-calendar .calendar-day span { padding:2px 1px; border-style:dashed; font-size:9px; }
    .teacher-calendar { margin-bottom:12px; }
    .teacher-calendar .calendar-day { min-height:48px; }
    .teacher-calendar .calendar-day span { font-size:9px; padding:2px 1px; }
    .teacher-list-toggle { height:26px; padding:0 8px; border:1px solid var(--line); border-radius:3px; font-size:12px; }
    .link { font-size:12px; color:var(--mid); }
    .link::after, .row::after { content:"›"; padding-left:5px; font-size:19px; vertical-align:-1px; }
    .metrics, .actions { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; }
    .actions { grid-template-columns:repeat(4,1fr); gap:4px; }
    .metric, .action { min-width:0; }
    .metric, .action { min-height:46px; }
    .metric-icon, .action-icon, .quick-icon, .row-icon, .tab-icon { display:block; border:1.5px solid var(--ink); border-radius:50%; margin:0 auto 6px; }
    .metric-icon { width:42px; height:42px; }
    .action-icon { width:36px; height:36px; }
    .notification-badge { position:absolute; top:-7px; right:-8px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:#c73535; color:#fff; font-style:normal; font-size:10px; line-height:17px; text-align:center; }
    .metric strong { display:block; font-size:16px; font-weight:500; }
    .metric:nth-child(1) strong { text-decoration:underline; }
    .metric small, .action small { display:block; font-size:12px; color:var(--ink); white-space:nowrap; }
    .action small { font-size:11px; }
    .quick { padding:0; display:grid; grid-template-columns:repeat(3,1fr); }
    .quick button { height:70px; border-right:1px solid var(--line); font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .quick button:last-child { border:0; }
    .quick-icon { width:22px; height:22px; margin-bottom:5px; }
    .list { padding:6px 14px; }
    .row { display:flex; align-items:center; width:100%; height:42px; text-align:left; border-bottom:1px solid #e2e4e6; }
    .row:last-child { border:0; }
    .row-icon { width:18px; height:18px; margin:0 10px 0 0; }
    .row::after { margin-left:auto; color:var(--mid); }
    .tabbar { position:fixed; z-index:2; left:50%; bottom:0; transform:translateX(-50%); width:min(100%,430px); height:70px; background:var(--paper); border:1px solid var(--line); display:grid; grid-template-columns:repeat(5,1fr); }
    .tabbar button { font-size:11px; color:var(--mid); display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .tab-icon { width:18px; height:18px; margin-bottom:4px; border-color:var(--mid); }
    .tabbar .active { color:var(--ink); font-weight:700; }
    .tabbar .active .tab-icon { border-color:var(--ink); }
    .modal-backdrop { position:fixed; inset:0; background:rgba(32,33,36,.28); display:none; place-items:center; padding:22px; z-index:3; }
    .modal-backdrop.show { display:grid; }
    .modal { width:min(100%,340px); border:1.5px solid var(--ink); background:var(--paper); padding:20px; text-align:center; }
    .modal h3 { margin:0 0 10px; font-size:18px; }
    .modal p { margin:0 0 18px; color:var(--mid); }
    .modal button { width:100%; height:38px; border:1px solid var(--ink); font-weight:700; }
    .role-detail { position:fixed; inset:0; z-index:4; display:none; background:#f6f7f8; max-width:430px; margin:auto; padding:12px 14px 84px; }
    .role-detail.show { display:block; }
    .detail-top { height:48px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--line); }
    .back { width:48px; height:30px; border:1px solid var(--line); border-radius:3px; }
    .detail-top h2 { font-size:20px; }
    .detail-list { margin-top:12px; background:var(--paper); border:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); gap:16px 4px; padding:18px 10px; }
    .detail-list .role-entry { border:0; min-height:62px; font-size:12px; font-weight:400; }
    .function-page { position:fixed; inset:0; z-index:5; display:none; background:#f6f7f8; max-width:430px; margin:auto; padding:12px 14px 84px; overflow:auto; }
    .function-page.show { display:block; }
    .function-intro { margin:14px 0 12px; padding:13px; border:1px solid var(--line); background:var(--paper); color:var(--mid); font-size:13px; }
    .function-card { margin-top:12px; border:1px solid var(--line); background:var(--paper); }
    .function-card h3 { margin:0; padding:12px 13px; font-size:15px; border-bottom:1px solid var(--line); }
    .function-row { min-height:48px; padding:10px 13px; border-bottom:1px solid #e2e4e6; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .function-row:last-child { border:0; }
    .function-row small { color:var(--mid); text-align:right; }
    .field { margin:12px 13px 0; }
    .field label { display:block; margin-bottom:6px; font-size:12px; color:var(--mid); }
    .field-box { height:38px; border:1px solid var(--line); padding:9px 10px; color:#92979c; font-size:13px; }
    .field-box.large { height:78px; }
    .primary-action { width:calc(100% - 26px); height:40px; border:1.5px solid var(--ink); margin:16px 13px; font-weight:700; }
    .membership-option { margin-top:12px; border:1.5px solid var(--ink); background:var(--paper); padding:16px; }
    .membership-option h3 { margin:0 0 8px; font-size:20px; }
    .membership-option .price { font-size:26px; font-weight:700; }
    .membership-option p { margin:10px 0 0; padding-top:10px; border-top:1px solid var(--line); color:var(--mid); font-size:13px; }
    .course-share { width:64px; height:28px; border:1px solid var(--line); border-radius:3px; font-size:12px; flex:0 0 auto; }
    .course-filters { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:14px 0 12px; }
    .course-filters select { width:100%; height:34px; border:1px solid var(--line); border-radius:3px; background:var(--paper); padding:0 7px; font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .record-filters { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin:14px 0 12px; }
    .record-filters select { width:100%; height:34px; border:1px solid var(--line); border-radius:3px; background:var(--paper); padding:0 7px; font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .course-cards { display:grid; gap:10px; }
    .course-card { background:var(--paper); border:1px solid var(--line); padding:11px; display:grid; grid-template-columns:82px 1fr; gap:11px; }
    .course-cover { border:1.5px solid var(--ink); min-height:104px; padding:7px; display:flex; flex-direction:column; justify-content:space-between; font-size:11px; }
    .course-cover b { font-size:19px; line-height:1.1; }
    .course-cover span { border-top:1px solid var(--line); padding-top:5px; color:var(--mid); }
    .course-info { min-width:0; }
    .course-info h3 { margin:0 0 6px; font-size:15px; line-height:1.35; }
    .course-meta { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
    .course-meta span { border:1px solid var(--line); padding:2px 5px; font-size:11px; color:var(--mid); }
    .course-desc { margin:0 0 8px; color:var(--mid); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .course-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .course-price { font-size:17px; font-weight:700; }
    .empty-state { border:1px dashed var(--line); padding:24px; text-align:center; color:var(--mid); }
    .hours-overview { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:14px 0 12px; }
    .hours-overview div { min-height:74px; padding:10px 8px; border:1px solid var(--line); background:var(--paper); text-align:center; }
    .hours-overview span { display:block; color:var(--mid); font-size:11px; }
    .hours-overview strong { display:block; margin-top:6px; font-size:19px; }
    .record-card { padding:12px 13px; border-bottom:1px solid #e2e4e6; }
    .record-card:last-child { border:0; }
    .record-card h4 { margin:0 0 7px; font-size:14px; }
    .record-meta { display:grid; grid-template-columns:1fr 1fr; gap:5px 12px; color:var(--mid); font-size:12px; }
    .schedule-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:14px 0 12px; }
    .schedule-stats div { padding:9px 5px; border:1px solid var(--line); background:var(--paper); text-align:center; }
    .schedule-stats span { display:block; color:var(--mid); font-size:11px; }
    .schedule-stats strong { display:block; margin-top:4px; font-size:16px; }
    .calendar-toolbar { display:flex; align-items:center; justify-content:space-between; height:40px; padding:0 10px; border:1px solid var(--line); border-bottom:0; background:var(--paper); }
    .calendar-toolbar button { width:34px; height:26px; border:1px solid var(--line); border-radius:3px; }
    .calendar-toolbar strong { font-size:15px; }
    .calendar-week { border:1px solid var(--line); background:var(--paper); }
    .calendar-labels, .calendar-days { display:grid; grid-template-columns:repeat(7,1fr); }
    .calendar-labels { border-bottom:1px solid var(--line); }
    .calendar-labels span { padding:6px 0; text-align:center; color:var(--mid); font-size:11px; }
    .calendar-day { min-height:70px; padding:5px 3px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .calendar-day:nth-child(7n) { border-right:0; }
    .calendar-day:nth-last-child(-n+7) { border-bottom:0; }
    .calendar-day b { display:block; font-size:11px; font-weight:400; color:var(--mid); }
    .calendar-day span { display:block; padding:3px 2px; border:1px solid var(--line); margin-top:3px; font-size:10px; line-height:1.25; }
    .calendar-day .free { color:var(--mid); border-style:dashed; text-align:center; margin-top:14px; }
    .calendar-day.empty { background:#fafafa; }
    .learning-child { width:100%; height:38px; margin:14px 0 12px; padding:0 10px; border:1px solid var(--line); background:var(--paper); font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .learning-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:12px; }
    .learning-stats div { padding:9px 5px; border:1px solid var(--line); background:var(--paper); text-align:center; }
    .learning-stats span { display:block; color:var(--mid); font-size:11px; }
    .learning-stats strong { display:block; margin-top:4px; font-size:15px; }
    .learning-calendar .calendar-day { min-height:64px; }
    .learning-calendar .calendar-day span { border-style:dashed; }
    .agenda-card { padding:12px 13px; border-bottom:1px solid #e2e4e6; }
    .agenda-card:last-child { border:0; }
    .agenda-card h4 { margin:0 0 6px; font-size:14px; }
    .agenda-card p { margin:3px 0; color:var(--mid); font-size:12px; }
    .agenda-card .agenda-status { display:inline-block; margin-top:5px; padding:2px 5px; border:1px solid var(--line); font-size:11px; color:var(--mid); }
    .feedback-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin:14px 0 12px; }
    .feedback-stats div { padding:10px; border:1px solid var(--line); background:var(--paper); }
    .feedback-stats span { display:block; color:var(--mid); font-size:12px; }
    .feedback-stats strong { display:block; margin-top:4px; font-size:19px; }
    .rating-options { display:flex; gap:9px; }
    .rating-option { width:32px; height:32px; border:1px solid var(--line); border-radius:50%; font-size:13px; }
    .rating-option.selected { background:var(--soft); border:1.5px solid var(--ink); font-weight:700; }
    .feedback-form textarea { width:100%; min-height:92px; resize:vertical; border:1px solid var(--line); padding:9px 10px; font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .feedback-form input, .feedback-form select { width:100%; height:38px; border:1px solid var(--line); padding:0 10px; background:var(--paper); font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .multi-select { position:relative; }
    .multi-trigger { width:100%; height:38px; border:1px solid var(--line); padding:0 10px; background:var(--paper); text-align:left; font-size:13px; }
    .multi-trigger::after { content:"⌄"; float:right; font-size:16px; color:var(--mid); }
    .multi-menu { display:none; position:absolute; z-index:6; top:38px; left:0; right:0; max-height:180px; overflow:auto; border:1px solid var(--line); background:var(--paper); box-shadow:0 4px 10px rgba(0,0,0,.08); }
    .multi-select.open .multi-menu { display:block; }
    .multi-menu label { display:flex; align-items:center; gap:7px; min-height:30px; padding:0 10px; font-size:13px; }
    .multi-menu label + label { border-top:1px solid #e2e4e6; }
    .multi-menu input { width:15px; height:15px; padding:0; }
    .child-card { display:grid; grid-template-columns:56px 1fr auto; gap:12px; padding:13px; border-bottom:1px solid #e2e4e6; }
    .child-card:last-child { border:0; }
    .child-avatar { width:52px; height:52px; border:1.5px solid var(--ink); border-radius:50%; display:grid; place-items:center; color:var(--mid); font-size:11px; }
    .child-card h4 { margin:0 0 7px; font-size:15px; }
    .child-fields { display:grid; grid-template-columns:1fr 1fr; gap:5px 12px; color:var(--mid); font-size:12px; }
    .child-edit { width:42px; height:25px; border:1px solid var(--line); border-radius:3px; font-size:12px; }
    .schedule-summary { margin-top:12px; padding:10px 12px; border:1px solid var(--line); background:var(--paper); color:var(--mid); font-size:12px; }
    .allocation-form { margin-top:14px; padding:2px 0 16px; border:1px solid var(--line); background:var(--paper); }
    .allocation-form .field select, .allocation-form .field input { width:100%; height:38px; border:1px solid var(--line); padding:0 10px; background:var(--paper); font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .available-tip { margin:8px 13px 0; font-size:12px; color:var(--mid); }
    .form-error { min-height:18px; margin:8px 13px 0; color:#9b3030; font-size:12px; }
    @media (min-width:431px) { .phone { box-shadow:0 0 0 1px #c4c7ca,0 8px 30px rgba(0,0,0,.12); } }
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>23:58</span><span class="signals">状态栏</span></div>
    <div class="title-row"><h1>个人中心</h1><button class="more" data-name="更多设置">设置</button></div>
    <section class="member">

    function renderHomework(config) {
      document.querySelector('#function-content').innerHTML = '<p class="function-intro">' + config.intro + '</p><section class="function-card feedback-form"><h3>作业内容</h3><div class="field"><label>选择课程</label><div class="multi-select" id="course-select"><button class="multi-trigger" type="button" id="course-trigger"></button><div class="multi-menu" id="course-menu"></div></div></div><div class="field"><label>布置给学生</label><div class="multi-select" id="student-select"><button class="multi-trigger" type="button" id="student-trigger"></button><div class="multi-menu" id="student-menu"></div></div></div><div class="field"><label>作业标题</label><input id="homework-title" type="text" placeholder="请输入作业标题"></div><div class="field"><label>作业要求</label><textarea id="homework-content" placeholder="请输入作业内容和完成要求"></textarea></div><div class="field"><label>截止时间</label><input id="homework-date" type="date"></div><p class="form-error" id="homework-error"></p><button class="primary-action" id="submit-homework">' + config.action + '</button></section>';

      const records = config.rows.filter(record => fields.every(([key]) => !filters[key] || record[key] === filters[key]));
      const options = (key, label) => '<option value="">全部' + label + '</option>' + [...new Set(config.rows.map(record => record[key]))].map(value => '<option' + (filters[key] === value ? ' selected' : '') + '>' + value + '</option>').join('');
      document.querySelector('#function-content').innerHTML = '<p class="function-intro">' + config.intro + '</p><div class="record-filters">' + fields.map(([key, label]) => '<select data-record-filter="' + key + '">' + options(key, label) + '</select>').join('') + '</div><section class="function-card"><h3>课程记录</h3>' + (records.length ? records.map(record => '<article class="record-card"><h4>' + record.course + '</h4><div class="record-meta"><span>孩子：' + record.student + '</span><span>老师：' + record.teacher + '</span><span>方式：' + record.mode + '</span><span>课时：' + record.hours + '</span><span>时间：' + record.time + '</span><span>地点：' + record.place + '</span></div></article>').join('') : '<div class="empty-state">暂无符合条件的课程记录</div>') + '</section>';
      document.querySelectorAll('[data-record-filter]').forEach(filter => filter.addEventListener('change', () => { const next = {}; document.querySelectorAll('[data-record-filter]').forEach(item => { next[item.dataset.recordFilter] = item.value; }); renderLearningRecords(config, next); }));
    }
    function renderRemainingHours(config) {
      document.querySelector('#function-content').innerHTML = '<p class="function-intro">' + config.intro + '</p><section class="function-card"><h3>课时概览</h3>' + config.rows.map(row => '<div class="function-row"><span>' + row[0] + '</span><strong>' + row[1] + '</strong></div>').join('') + '</section><section class="function-card"><button class="primary-action" id="renew-hours">' + config.action + '</button></section>';
      document.querySelector('#renew-hours').addEventListener('click', () => { document.querySelector('#modal-title').textContent = '续费课时'; document.querySelector('#modal-text').textContent = '线框原型：已进入课时续费流程。'; modal.classList.add('show'); });
    }
    function renderChildForm(config, editIndex = null) {
      const child = editIndex === null ? {} : config.children[editIndex]; const isEditing = editIndex !== null;
      document.querySelector('#function-title').textContent = isEditing ? '修改孩子信息' : '添加孩子';
      document.querySelector('#function-content').innerHTML = '<p class="function-intro">请填写孩子的基本学习信息，保存后可继续添加其他孩子。</p><section class="function-card feedback-form"><h3>基本信息</h3><div class="field"><label>孩子头像</label><div class="child-avatar">头像</div></div><div class="field"><label>孩子姓名</label><input id="child-name" type="text" value="' + (child.name || '') + '" placeholder="请输入孩子姓名"></div><div class="field"><label>性别</label><select id="child-gender"><option value="">请选择性别</option><option' + (child.gender === '男' ? ' selected' : '') + '>男</option><option' + (child.gender === '女' ? ' selected' : '') + '>女</option></select></div><div class="field"><label>年级</label><select id="child-grade"><option value="">请选择年级</option>' + ['一年级','二年级','三年级','四年级','五年级','六年级','初一','初二','初三'].map(grade => '<option' + (child.grade === grade ? ' selected' : '') + '>' + grade + '</option>').join('') + '</select></div><div class="field"><label>就读学校</label><input id="child-school" type="text" value="' + (child.school || '') + '" placeholder="请输入就读学校"></div><p class="form-error" id="child-error"></p><button class="primary-action" id="save-child">' + (isEditing ? '保存修改' : '保存孩子信息') + '</button></section>';
      document.querySelector('#save-child').addEventListener('click', () => {
        const name = document.querySelector('#child-name').value.trim(); const gender = document.querySelector('#child-gender').value; const grade = document.querySelector('#child-grade').value; const school = document.querySelector('#child-school').value.trim(); const error = document.querySelector('#child-error');
        if (!name || !gender || !grade || !school) { error.textContent = '请完整填写孩子信息'; return; }
        if (isEditing) config.children[editIndex] = {name, gender, grade, school}; else config.children.push({name, gender, grade, school}); openFunction(config);
        document.querySelector('#modal-title').textContent = isEditing ? '修改成功' : '添加成功'; document.querySelector('#modal-text').textContent = '已保存“' + name + '”的学生档案。'; modal.classList.add('show');
      });
    }
    document.querySelector('#function-back').addEventListener('click', () => functionPage.classList.remove('show'));
    // Notify the standalone UX notes preview without changing the prototype flow.
    function reportPreviewPage(page) {
      if (window.parent !== window) window.parent.postMessage({ channel: 'personal-center-prototype', page }, '*');
    }
    function currentRoleKey() {
      return ({ '业务中心':'partner', '教学中心':'teacher', '学习中心':'parent' })[document.querySelector('#detail-title').textContent] || '';
    }
    document.addEventListener('click', event => {
      const target = event.target instanceof Element ? event.target : event.target.parentElement;
      if (!target) return;
      const roleEntry = target.closest('[data-role-detail]');
      if (roleEntry) { reportPreviewPage(roleEntry.dataset.roleDetail); return; }
      const functionEntry = target.closest('[data-function]');
      if (functionEntry) { reportPreviewPage(currentRoleKey() + '-' + functionEntry.dataset.function); return; }
      if (target.closest('.teacher-calendar')) { reportPreviewPage('teacher-排课动态'); return; }
      if (target.closest('.learning-main-calendar') || target.closest('.learning-upcoming')) { reportPreviewPage('parent-课程计划'); return; }
      if (target.closest('#role-back')) { reportPreviewPage('profile'); return; }
      if (target.closest('#function-back')) { reportPreviewPage(currentRoleKey()); return; }
      if (target.closest('#add-child') || target.closest('[data-edit-child]')) reportPreviewPage('parent-学生档案');
    }, true);
  </script>
</body>
</html>
